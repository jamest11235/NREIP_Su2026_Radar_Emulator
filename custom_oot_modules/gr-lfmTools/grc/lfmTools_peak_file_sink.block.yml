id: lfmTools_peak_file_sink
label: Peak File Sink
category: '[LFM Tools]'

templates:
  imports: from gnuradio import lfmTools
  make: lfmTools.peak_file_sink(${file}, ${tx}, ${rx})

parameters:
- id: file
  label: File
  dtype: string
  default: delay.txt
- id: tx
  label: TX Peak Label
  dtype: string
  default: RUT
- id: rx
  label: RX Peak Label
  dtype: string
  default: Target

inputs:
- label: in
  domain: stream
  dtype: float

outputs:
- label: delay
  domain: message
  optional: true

file_format: 1
