id: lfmTools_tag_advance
label: Tag Advance
category: '[LFM Tools]'

templates:
  imports: from gnuradio import lfmTools
  make: lfmTools.tag_advance(${advance_samples})
  callbacks:
  - set_advance_samples(${advance_samples})

parameters:
- id: advance_samples
  label: Samples
  dtype: int
  default: 0
  
inputs:
- label: in
  domain: stream
  dtype: float
  
outputs:
- label: out
  domain: stream
  dtype: float

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
